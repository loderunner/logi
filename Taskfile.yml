version: "3"

tasks:
  default:
    cmds:
      - task --list
    silent: true

  generate:
    desc: Regenerate the mocks with mockgen
    cmds:
      - go generate ./...

  fmt:
    desc: Format the code with golangci-lint
    preconditions:
      - sh: command -v golangci-lint
        msg: "golangci-lint not found: brew install golangci-lint"
    cmds:
      - golangci-lint fmt

  lint:
    desc: Run golangci-lint
    preconditions:
      - sh: command -v golangci-lint
        msg: "golangci-lint not found: brew install golangci-lint"
    cmds:
      - golangci-lint run

  test:
    desc: Run the tests with the race detector
    cmds:
      - go test -race ./...

  build:
    desc: Build the binaries into bin/
    cmds:
      - go build -trimpath -o bin/logi .

  run:
    desc: Run logi
    cmds:
      - go run . {{.CLI_ARGS}}

  genlogs:
    desc: Write synthetic JSONL logs to stdout
    cmds:
      - go run ./cmd/genlogs {{.CLI_ARGS}}
